r Tuber aestivum. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "검은트러플"}, {"id": "Porcini", "ko": "포르치니", "en": "porcini", "scientific": "Boletus edulis", "group": "premium-wild-edible", "identity_status": "photo-verified", "selection_note": "German exact-species research-grade observation; excludes California B. edulis grandedulis variety shown in other search results. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "포르치니"}, {"id": "Morel", "ko": "곰보버섯", "en": "morel", "scientific": "Morchella esculenta", "group": "premium-wild-edible", "identity_status": "photo-verified", "selection_note": "Bulgarian research-grade observation explicitly identified as M. esculenta; not a false morel or a North American substitute. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "곰보버섯"}, {"id": "BlackTrumpet", "ko": "블랙트럼펫", "en": "black trumpet", "scientific": "Craterellus cornucopioides", "group": "premium-wild-edible", "identity_status": "photo-verified", "selection_note": "English research-grade observation; avoids geographical species ambiguity of similar North American black trumpets. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "블랙트럼펫"}, {"id": "GiantPuffball", "ko": "댕구알버섯", "en": "giant puffball", "scientific": "Calvatia gigantea", "group": "unusual-wild-edible", "identity_status": "photo-verified", "selection_note": "Research-grade primary photo of the giant puffball. Young pale whole fruit body should guide the game art, not a mature broken spore sac. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "댕구알버섯"}, {"id": "IndigoMilkcap", "ko": "파란젖버섯", "en": "indigo milkcap", "scientific": "Lactarius indigo", "group": "unusual-wild-edible", "identity_status": "photo-verified", "selection_note": "Mexican research-grade exact-species photo. Preserve real blue zones and morphology; not a generic blue toadstool. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "파란젖버섯"}, {"id": "VeiledStinkhorn", "ko": "망태버섯", "en": "veiled stinkhorn", "scientific": "Phallus indusiatus", "group": "unusual-wild-edible", "identity_status": "photo-verified", "selection_note": "Research-grade observation of the white-net veiled stinkhorn. Yellow-net Phallus species are not substituted. Korean NIBR maps 망태버섯 to P. indusiatus. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "망태버섯"}, {"id": "ShaggyInkcap", "ko": "먹물버섯", "en": "shaggy inkcap", "scientific": "Coprinus comatus", "group": "unusual-wild-edible", "identity_status": "photo-verified", "selection_note": "Korean forest/BRIS sources identify 먹물버섯 as C. comatus. It is the shaggy inkcap, not smooth gray Coprinopsis atramentaria. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "먹물버섯"}, {"id": "Lobster", "ko": "랍스터버섯", "en": "lobster mushroom", "scientific": "Hypomyces lactifluorum", "group": "unusual-wild-edible", "identity_status": "photo-verified", "selection_note": "Exact parasite taxon research-grade observation; the visible fruit body is the infected Russula/Lactarius host, not an independent standard-shaped Hypomyces cap. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "랍스터버섯"}, {"id": "Reishi", "ko": "영지버섯", "en": "reishi", "scientific": "Ganoderma sichuanense (syn. Ganoderma lingzhi)", "group": "medicinal", "identity_status": "photo-verified", "selection_note": "Photograph of taxonomically studied Thai collection MFU16-2668. Exact original JPEG extracted from the deposited CC BY4 publication PDF (page11/Figure2), without repainting or changing pixels. Select East Asian reishi under G. sichuanense / G. lingzhi naming; European G. lucidum sensu stricto is excluded. A 2023 type-material study treats G. lingzhi as a later synonym of G. sichuanense. Commons image CDN returned429; source publisher deposited PDF accessed normally at Zenodo.", "source_korean_label": "영지버섯"}, {"id": "TurkeyTail", "ko": "구름버섯", "en": "turkey tail", "scientific": "Trametes versicolor", "group": "medicinal", "identity_status": "photo-verified", "selection_note": "Research-grade exact-species photo. Many differently colored thin fans are characteristic; avoid the thicker orange pore surface of lookalikes. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "구름버섯"}, {"id": "Sanghuang", "ko": "상황버섯", "en": "sanghuang", "scientific": "Sanghuangporus sanghuang", "group": "medicinal", "identity_status": "photo-verified", "selection_note": "Original photograph in Figure1 of a primary taxonomy/phylogeny paper. Figure contains six species: A alpinus, B lonicerinus, C sanghuang, D baumii, E vaninii, F lonicericola. C is the required exact species; other panels must not be used as sanghuang. Exact original JPEG extracted unchanged from CC BY article PDF page6. Commons exact-species CC0 photos identified but CDN429. Museum holotype source also verified identity; museum canDownload=false so museum photos were not downloaded.", "source_korean_label": "상황버섯"}, {"id": "Cordyceps", "ko": "동충하초", "en": "cordyceps", "scientific": "Cordyceps militaris", "group": "medicinal", "identity_status": "photo-verified", "selection_note": "Choose C. militaris as the exact artistic species rather than Ophiocordyceps sinensis or zombie-ant fungus. Primary research-grade photo. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "동충하초"}, {"id": "Chaga", "ko": "차가버섯", "en": "chaga", "scientific": "Inonotus obliquus", "group": "medicinal", "identity_status": "photo-verified", "selection_note": "Research-grade species observation. Game reference is the black sterile chaga mass, not the rare resupinate fertile fruit body. Downloaded unchanged as anatomy reference only. Photo license confirmed through public API; community research-grade identification is not a genetic identification.", "source_korean_label": "차가버섯"}, {"id": "LibertyCap", "ko": "자유모자버섯", "en": "liberty cap", "scientific": "Psilocybe semilanceata", "group": "psychoactive", "identity_status": "photo-verified", "selection_note": "Replace underside-only initial photo with side views. Korean label is a game working name.", "source_korean_label": "자유모자"}, {"id": "PantherCap", "ko": "마귀광대버섯", "en": "panther cap", "scientific": "Amanita pantherina", "group": "psychoactive-toxic", "identity_status": "photo-verified", "selection_note": "Keep brown cap with white warts distinct from red fly agaric.", "source_korean_label": "마귀광대"}, {"id": "Cubensis", "ko": "실로시빈 버섯 추가종", "en": "cubensis", "scientific": "Psilocybe cubensis", "group": "psychoactive", "identity_status": "photo-verified", "selection_note": "PROVI const D=JSON.parse(document.querySelector('#data').textContent);const kinds=['01Low','02Medium','03Full','PlantA','PlantB'];
const path=(id,k,list=D.files)=>list.find(f=>f.species===id&&f.kind===k)?.file;
const img=(src)=>{const i=document.createElement('img');i.src=src;i.alt='';i.loading='lazy';return i};
const fig=(src,label)=>{const f=document.createElement('figure');f.append(img(src));const c=document.createElement('figcaption');c.textContent=label;f.append(c);return f};
function scene(id,g){const f=document.createElement('figure'),s=document.createElement('div');s.className='scene';const slots=[4,0,8,2,6,1,7,3,5];const n=Math.max(1,Math.ceil(9*g)),size=.3+.35*g;slots.slice(0,n).map((slot,j)=>({j,x:(slot%3+.5)/3,z:(Math.floor(slot/3)+.5)/3})).sort((a,b)=>a.z-b.z).forEach(({j,x,z})=>{const i=img(path(id,j%2?'PlantB':'PlantA'));const w=size*68;i.style.width=w+'%';i.style.left=(16+x*68-w/2)+'%';i.style.top=(13+z*65-w*.80)+'%';if(j%3===0)i.style.transform='scaleX(-1)';s.append(i)});f.append(s);const c=document.createElement('figcaption');c.textContent=`${Math.round(g*100)}% · ${n}개 · ${size.toFixed(4)}칸`;f.append(c);return f}
function card(row,list,withGrowth){const a=document.createElement('article');a.className='card';a.dataset.search=[row.id,row.ko,row.name,row.en,row.scientific].filter(Boolean).join(' ').toLowerCase();const h=document.createElement('h2');h.textContent=row.ko||row.name||row.id;a.append(h);const p=document.createElement('p');p.className='muted';p.textContent=row.scientific||row.id;a.append(p);if(row.provisional_species_choice){const note=document.createElement('p');note.className='tag';note.textContent='그림 초안의 잠정 대표종';a.append(note)}const r=document.createElement('div');r.className='row';kinds.forEach((k,j)=>r.append(fig(path(row.id,k,list),['Low · 1~25','Medium · 26~50','Full · 51~75','성체 변형 A','성체 변형 B'][j])));a.append(r);if(withGrowth){const gr=document.createElement('div');gr.className='row growth';gr.style.marginTop='12px';[.25,.5,.75,1].forEach(g=>gr.append(scene(row.id,g)));a.append(gr)}return a}
const done=D.rows.filter(r=>kinds.every(k=>path(r.id,k)));done.forEach(r=>document.querySelector('#cards').append(card(r,D.files,true)));document.querySelector('#status').textContent=(D.complete?'완성 검증 완료':'진행 중 · 전체 31종 완성 아님')+` — 내보낸 ${done.length}종 / ${D.files.length}개 텍스처`;
[...new Set(D.baseline.map(x=>x.species))].forEach(id=>document.querySelector('#baseline-cards').append(card({id},D.baseline,false)));
document.querySelector('#baseline-toggle').onclick=()=>{const el=document.querySelector('#baseline');el.hidden=!el.hidden};document.querySelector('#filter').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#cards .card').forEach(el=>el.hidden=!el.dataset.search.includes(q))};
</script></html>
